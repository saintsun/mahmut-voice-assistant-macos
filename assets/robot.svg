<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1328"/><stop offset="0.55" stop-color="#080b14"/>
      <stop offset="1" stop-color="#160b2a"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/><stop offset="1" stop-color="#b14bff"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2d4f"/><stop offset="1" stop-color="#0d1730"/>
    </linearGradient>
    <radialGradient id="hc"><stop offset="0" stop-color="#00e5ff" stop-opacity=".5"/>
      <stop offset="0.5" stop-color="#00e5ff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="hg"><stop offset="0" stop-color="#4dffc0" stop-opacity=".45"/>
      <stop offset="0.5" stop-color="#4dffc0" stop-opacity=".12"/>
      <stop offset="1" stop-color="#4dffc0" stop-opacity="0"/></radialGradient>
    <radialGradient id="hpk"><stop offset="0" stop-color="#ff7bb0" stop-opacity=".55"/>
      <stop offset="0.6" stop-color="#ff7bb0" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ff7bb0" stop-opacity="0"/></radialGradient>
    <clipPath id="card"><rect x="36" y="36" width="952" height="952" rx="214"/></clipPath>
  </defs>

  <rect x="36" y="36" width="952" height="952" rx="214" fill="url(#bg)"/>
  <rect x="36" y="36" width="952" height="952" rx="214" fill="none"
        stroke="url(#edge)" stroke-width="30" opacity="0.16"/>
  <rect x="42" y="42" width="940" height="940" rx="210" fill="none"
        stroke="url(#edge)" stroke-width="10"/>

  <g clip-path="url(#card)">
    <!-- yumusak parlamalar -->
    <circle cx="512" cy="150" r="130" fill="url(#hc)"/>
    <circle cx="408" cy="470" r="170" fill="url(#hc)"/>
    <circle cx="616" cy="470" r="170" fill="url(#hc)"/>
    <circle cx="512" cy="636" r="190" fill="url(#hg)"/>
    <circle cx="316" cy="582" r="110" fill="url(#hpk)"/>
    <circle cx="708" cy="582" r="110" fill="url(#hpk)"/>

    <!-- anten: yuvarlak, yumusak -->
    <line x1="512" y1="268" x2="512" y2="186" stroke="#00e5ff" stroke-width="18" stroke-linecap="round"/>
    <circle cx="512" cy="162" r="46" fill="#8af3ff"/>
    <circle cx="500" cy="150" r="17" fill="#ffffff" opacity=".9"/>

    <!-- kulaklik kulaklari -->
    <rect x="166" y="448" width="74" height="168" rx="37" fill="#2a1a4d" stroke="#b14bff" stroke-width="9"/>
    <rect x="784" y="448" width="74" height="168" rx="37" fill="#2a1a4d" stroke="#b14bff" stroke-width="9"/>

    <!-- kafa: genis, yuvarlak, sevimli -->
    <rect x="228" y="276" width="568" height="472" rx="190" fill="url(#face)"
          stroke="url(#edge)" stroke-width="12"/>

    <!-- gozler: buyuk, parlak, isiltili -->
    <circle cx="408" cy="470" r="76" fill="#eafcff"/>
    <circle cx="408" cy="470" r="46" fill="#0b1b36"/>
    <circle cx="390" cy="452" r="21" fill="#ffffff"/>
    <circle cx="420" cy="492" r="9" fill="#ffffff" opacity=".8"/>
    <circle cx="616" cy="470" r="76" fill="#eafcff"/>
    <circle cx="616" cy="470" r="46" fill="#0b1b36"/>
    <circle cx="598" cy="452" r="21" fill="#ffffff"/>
    <circle cx="628" cy="492" r="9" fill="#ffffff" opacity=".8"/>

    <!-- yanaklar -->
    <ellipse cx="316" cy="582" rx="48" ry="31" fill="#ff8fbe" opacity=".75"/>
    <ellipse cx="708" cy="582" rx="48" ry="31" fill="#ff8fbe" opacity=".75"/>

    <!-- gulumseme -->
    <path d="M432 600 Q512 684 592 600" fill="none" stroke="#4dffc0"
          stroke-width="26" stroke-linecap="round"/>

    <!-- taban golgesi -->
    <ellipse cx="512" cy="852" rx="236" ry="22" fill="#00e5ff" opacity=".1"/>
  </g>
</svg>
